<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTIS 生成重播</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday learning: a lab time-lapse of one creature being made, calm and exact
   IDEA a specimen time-lapse under a dark lens, with the protocol sheet beside it
   PICTURE the live 3D stage (dark dish) replaying each step; a 2D lens for the Fourier circles
   COLOUR parent A orange #e07b39, parent B blue #3b7dd8 (the ancestry colours of every figure), ink dish #10151b
   TYPE Space Grotesk 600 titles + Inter / Noto Sans TC text
   LAYOUT laptop: stage left 64%, protocol right, step strip under the stage; phone: title, stage, controls, protocol */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b0d10);--ink:light-dark(#14171c,#e8ebef);--mute:light-dark(#5b6370,#9aa3ae);--line:light-dark(#e3e6ea,#262b33);--panel:light-dark(#f5f6f8,#13171c);--a:#e07b39;--b:#3b7dd8;--dish:#10151b;--ok:#1f9d6b;--bad:#d64545}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:"Space Grotesk","Noto Sans TC",Inter,sans-serif;font-weight:600;letter-spacing:-.02em;line-height:1.05;margin:0}
h1{font-size:clamp(22px,2.6vw,32px)}
h2{font-size:clamp(22px,2.2vw,30px);text-wrap:balance}
.app{display:grid;grid-template-columns:minmax(0,64fr) minmax(0,36fr);grid-template-rows:auto minmax(0,1fr) auto;height:100%;max-width:1680px;margin:0 auto}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:14px max(2vw,16px) 10px}
header .meta{color:var(--mute);font-size:14px}
.key{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.stage{position:relative;margin:0 0 0 max(2vw,16px);border-radius:14px;overflow:hidden;background:var(--dish);min-height:360px}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#lens{pointer-events:none;opacity:0;transition:opacity .4s}
#lens.on{opacity:1}
.stage.lensed .cap{display:none}
.cap{position:absolute;left:14px;bottom:12px;right:14px;color:#cfd6de;font-size:13px;display:flex;justify-content:space-between;gap:12px;pointer-events:none}
.cap b{color:#fff;font-weight:600}
.side{grid-row:2/4;grid-column:2;overflow-y:auto;padding:4px max(2vw,16px) 24px 22px}
.side .zh{color:var(--mute);margin-top:-2px}
.side p{margin:0 0 10px}
.lines{margin:12px 0 16px}
.lines p{margin:0}
.lines .pair{margin-bottom:12px}
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
.sec h3{font-size:15px;margin:0 0 8px;font-weight:600}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--mute)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;width:90px;display:inline-block;vertical-align:middle;margin-right:6px}
.bar i{display:block;height:100%;background:var(--ink)}
.strip{display:flex;flex-wrap:wrap;gap:2px;margin:4px 0 2px}
.cell{width:13px;height:18px;border-radius:2px;background:var(--line);transition:background .25s}
.cell.A{background:var(--a)}
.cell.B{background:var(--b)}
.cell.gap{width:6px;background:none}
.prow{margin-bottom:10px}
.prow .nm{font-weight:600;font-size:14px}
.prow .src{color:var(--mute);font-size:13px}
.drop{color:var(--mute);font-size:14px;margin:2px 0}
.drop s{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;min-height:36px;padding:4px 12px;border-radius:18px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,.step:focus-visible,input:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--bad);font-weight:600}
.ctl{grid-column:1;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0 4px max(2vw,16px)}
.btn{font:inherit;font-size:15px;min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;padding:0 14px}
.btn.play{background:var(--ink);color:var(--bg);border-color:var(--ink);min-width:92px}
#scrub{flex:1 1 160px;accent-color:var(--a);height:44px}
select{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 8px}
.steps{grid-column:1;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 16px max(2vw,16px)}
.step{font:inherit;font-size:13px;line-height:1.25;text-align:left;min-height:44px;padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;flex:1 1 120px;max-width:200px}
.step b{display:block;color:var(--ink);font-weight:600;font-size:13px}
.step.on{border-color:var(--ink);background:var(--panel)}
.step.done{color:var(--mute)}
.step .pg{display:block;height:3px;margin-top:4px;border-radius:2px;background:var(--line);overflow:hidden}
.step .pg i{display:block;height:100%;width:0;background:var(--a)}
.slider{display:flex;align-items:center;gap:10px;margin:6px 0}
.slider input{flex:1;accent-color:var(--a);height:44px}
.foot{color:var(--mute);font-size:13px;margin-top:18px}
.err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#cfd6de;padding:24px;text-align:center}
@media(max-width:900px){
.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto auto auto;height:auto}
.stage{margin:0 16px;height:56svh;min-height:300px}
.ctl,.steps{grid-column:1;padding-left:16px;padding-right:16px}
.side{grid-column:1;grid-row:auto;overflow:visible;padding:8px 16px 32px;order:4}
header{order:1}
.stage{order:2}
.ctl{order:3}
.steps{order:5}
.step{flex:1 1 30%;max-width:none}
}
@media(prefers-reduced-motion:reduce){.cell,#lens{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>RTIS 生成重播 · Generation replay</h1>
    <span class="meta" id="runmeta"></span>
    <span class="key"><span class="dot" style="background:var(--a)"></span><span id="keyA">A</span></span>
    <span class="key"><span class="dot" style="background:var(--b)"></span><span id="keyB">B</span></span>
  </header>
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="3D replay of the generation process"></canvas>
    <canvas id="lens" aria-hidden="true"></canvas>
    <div class="cap"><span id="capL"></span><span id="capR">Drag to turn · 拖曳旋轉</span></div>
    <div class="err" id="err">3D could not start in this browser. The step texts and tables on the right still show the whole run.<br>這個瀏覽器無法啟動 3D，右邊的文字與表格仍然完整呈現這次執行。</div>
  </div>
  <aside class="side" id="side" aria-live="polite"></aside>
  <div class="ctl">
    <button class="btn" id="prev" aria-label="Previous step">◀</button>
    <button class="btn play" id="play">Play 播放</button>
    <button class="btn" id="next" aria-label="Next step">▶</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" aria-label="Position within this step">
    <select id="speed" aria-label="Speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
  </div>
  <nav class="steps" id="steps" aria-label="Steps"></nav>
</div>
<script type="application/json" id="data">/*DATA*/</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const D = JSON.parse(document.getElementById('data').textContent);
const $ = id => document.getElementById(id);
const CA = '#e07b39', CB = '#3b7dd8';
const PAL = ['#5fb3b3','#c594c5','#f2c14e','#7fb069','#ee6c4d','#98c1d9','#e5989b','#b8b08d','#8d99ae'];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const A = D.parents[0], B = D.parents[1], C = D.child, P = D.package;
const pct = x => Math.round(x * 100) + '%';
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const why = w => w === 'not inherited' ? 'left out by chance · 機率沒遺傳到'
  : w.startsWith('lost the site to') ? `lost its place to ${w.slice(17)} (site rule) · 位置規則：輸給 ${w.slice(17)}`
  : w === 'parent missing' ? 'parent missing · 父部位不在' : w;
$('runmeta').textContent = `${D.run.a} × ${D.run.b}, seed ${D.run.seed} · one recorded run, replayed · 一次真實執行的重播`;
$('keyA').textContent = `A ${A.name}`; $('keyB').textContent = `B ${B.name}`;

// ---------- data decoding ----------
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0)).buffer;
const f32 = s => new Float32Array(bytes(s)), u32 = s => new Uint32Array(bytes(s)), u8 = s => new Uint8Array(bytes(s));
const mix = (c1, c2, t) => { const a = new THREE.Color(c1), b = new THREE.Color(c2); return b.lerp(a, t); };

// ---------- step texts (numbers come from the recorded run) ----------
const errs = D.prologue.mean_error;
const pairsTbl = D.matching.pairs.map(p => `<tr><td>${esc(p.a)}</td><td>${esc(p.b)}</td><td class="n">${p.score.toFixed(3)}</td><td>${p.how === 'root' ? 'root 根' : p.how === 'clear' ? '≥ 0.40' : 'chance 機率'}</td></tr>`).join('');
const decTbl = D.matching.decisions.map(d => `<tr><td>${esc(d.a)} ~ ${esc(d.b)}</td><td class="n">${d.score.toFixed(3)}</td><td class="n"><span class="bar"><i style="width:${pct(d.chance)}"></i></span>${pct(d.chance)}</td><td class="${d.matched ? 'ok' : 'bad'}">${d.matched ? 'matched 配上' : 'not matched 沒配上'}</td></tr>`).join('');
const geneOrder = g => g.single ? null : [['size', g === C.parts[0].genes ? (C.scale_src === 'A') : null], ['head', g.head], ...g.lengths.map((x, i) => ['L' + (i + 1), x]), ['gap'], ...g.bends.map((x, i) => ['bend' + (i + 1), x]), ['gap'], ...g.radii.map((x, i) => ['r' + i, x]), ['gap'], ['blend', g.blend], ['attach', g.attach], ['detail', g.detail]].filter(c => c[0] === 'gap' || c[1] !== null);
let geneCells = 0;
const strips = C.parts.map(p => {
  const g = p.genes, order = geneOrder(g);
  const cells = order ? order.map(([k, v]) => k === 'gap' ? '<span class="cell gap"></span>' : `<span class="cell" data-i="${geneCells++}" data-s="${v ? 'A' : 'B'}" title="${k}: ${v ? 'A' : 'B'}"></span>`).join('')
    : Array.from({length: p.bones * 2 + 3}, () => `<span class="cell" data-i="${geneCells++}" data-s="${g.template}"></span>`).join('');
  const src = p.origin.map(esc).join(' + ');
  return `<div class="prow"><span class="nm">${esc(p.name)}</span> <span class="src">${src}${order ? ` · ${pct(p.ancestry_a)} from A` : ` · whole part from ${g.template} 整個部位來自 ${g.template}`}</span><div class="strip">${cells}</div></div>`;
}).join('');
const drops = C.dropped.map(d => `<p class="drop"><s>${d.parts.map(esc).join(' + ')}</s> · ${esc(why(d.why))}</p>`).join('');
const fparts = C.parts.filter(p => p.fourier.terms.length > 1);
const srcOutline = p => p.origin.map(o => { const [lab, nm] = o.split('.'); const par = lab === 'A' ? A : B; return {lab, nm, f: par.parts.find(q => q.name === nm).fourier}; });
const bodyWH = C.parts[0].fourier.width_to_height;
const bones = P.counts.bones, b = C.body, m = C.motion;
const groupChips = ['tag:limb', 'tag:head', 'tag:torso', 'tag:weapon_part', 'arrangement:mirror', 'attached', 'root'].filter(k => P.groups[k]);

const STEPS = [
 {id: 'idea', en: 'Where it started: drawing with circles', zh: '起點：用圓畫圖', dur: 13,
  lines: [['The first idea (11-09): draw a closed 3D curve with rotating circles, then fill in the faces.', '最初的想法（11-09）：用旋轉的圓在三維空間畫出閉合曲線，再把面補上。'],
          ['In 3D each term traces a tilted ellipse. More terms bring the curve closer to the target: a path through the cube\'s 8 corners.', '在三維裡每一項畫的是傾斜的橢圓。項數越多，曲線越貼近目標：走過立方體 8 個頂點的路徑。'],
          ['Drawing the curve worked; filling in the faces did not. Fourier stayed on as the outline of each part\'s cross-section.', '畫線可行，補面不行。傅立葉留了下來，變成每個部位的截面輪廓。']],
  extra: () => `<div class="sec"><h3>Number of circles 圓的數量</h3><div class="slider"><input type="range" id="nterms" min="1" max="40" value="12" aria-label="Number of terms"><b id="ntv">12</b></div>
    <div class="tbl"><table><tr><th>Terms 項數</th>${Object.keys(errs).map(k => `<th class="n">${k}</th>`).join('')}</tr><tr><td>Mean error 平均誤差</td>${Object.values(errs).map(v => `<td class="n">${v.toFixed(3)}</td>`).join('')}</tr></table></div></div>`},
 {id: 'parents', en: 'Two parents', zh: '兩個親代', dur: 7,
  lines: [[`A: ${A.name}, ${A.parts.length} parts, ${A.genes} genes. B: ${B.name}, ${B.parts.length} parts, ${B.genes} genes.`, `A：${A.name}，${A.parts.length} 個部位、${A.genes} 個基因。B：${B.name}，${B.parts.length} 個部位、${B.genes} 個基因。`],
          ['Each part is a chain of bones; the skin you see is grown around them. Tags come from RTIS ontology.py.', '每個部位是一條骨頭鏈，看到的皮是圍著骨頭長出來的。標籤來自 RTIS 的 ontology.py。']],
  extra: () => [A, B].map(par => `<div class="sec"><h3><span class="dot" style="background:${par.label === 'A' ? CA : CB}"></span> ${par.label}: ${esc(par.name)}</h3><div class="tbl"><table>${par.parts.map(q => `<tr><td>${esc(q.name)}</td><td>${q.arrangement}</td><td class="n">${q.bones} bones</td><td>${q.tags.map(esc).join(', ')}</td></tr>`).join('')}</table></div></div>`).join('')},
 {id: 'match', en: 'Matching parts with PCE', zh: '用 PCE 配對部位', dur: 9,
  lines: [['PCE scores each pair of parts by shared tags, counting part-layer tags (torso, limb, head…) twice.', 'PCE 依共同標籤替每一對部位打分數，部位層標籤（torso、limb、head…）算兩倍。'],
          ['0.40 or more: always matched. 0.25 to 0.40: matched by chance, more likely the higher the score. Below 0.25: never.', '0.40 以上一定配；0.25 到 0.40 依機率，分數越高越可能配上；0.25 以下不配。']],
  extra: () => `<div class="sec"><h3>Matched 配上的部位</h3><div class="tbl"><table><tr><th>A</th><th>B</th><th class="n">PCE</th><th>rule 規則</th></tr>${pairsTbl}</table></div></div>
    <div class="sec"><h3>Borderline, decided by chance this time 邊界配對，這次擲出的結果</h3><div class="tbl"><table>${decTbl || '<tr><td>none 沒有</td></tr>'}</table></div></div>
    <div class="sec"><p class="drop">Unmatched in A 沒配上：${D.matching.unmatched_a.map(esc).join(', ') || '—'}</p><p class="drop">Unmatched in B 沒配上：${D.matching.unmatched_b.map(esc).join(', ') || '—'}</p></div>`},
 {id: 'genes', en: 'Inheritance, gene by gene', zh: '逐個基因遺傳', dur: 11,
  lines: [['Each gene is copied whole from one parent, never averaged. Along a chain, genes travel in runs with one switch point (linkage).', '每個基因整個從一方複製，不做平均。沿著一條鏈，基因成段遺傳，中間只有一個交換點（連鎖）。'],
          [`Body size gene: from ${C.scale_src}. Overall ${pct(C.ancestry_overall)} of the genes come from A.`, `體型基因來自 ${C.scale_src}。整體 ${pct(C.ancestry_overall)} 的基因來自 A。`],
          ['Unmatched parts are kept by chance. Two unmatched limbs in one place compete, and only one stays (site rule).', '沒配對的部位依機率保留。同一個位置有兩條沒配對的肢體時互相競爭，只留一個（位置規則）。']],
  extra: () => `<div class="sec"><h3>Genes per part 每個部位的基因</h3><p class="drop">head · L = bone lengths 骨頭長度 · bend 彎折 · r = joint thickness 關節粗細 · blend · attach · detail</p>${strips}</div><div class="sec"><h3>Not in the child 沒進入子代</h3>${drops || '<p class="drop">none</p>'}</div>`},
 {id: 'skeleton', en: 'The skeleton grows', zh: '骨架長出來', dur: 8,
  lines: [[`The child's genes grow into ${C.parts.length} parts and ${bones} bones, each part after the one it hangs from.`, `子代的基因長成 ${C.parts.length} 個部位、${bones} 根骨頭，每個部位接在它的父部位之後長出來。`],
          ['Bone colour = which parent the bone\'s length gene came from.', '骨頭顏色＝這根骨頭的長度基因來自哪一方。']]},
 {id: 'fourier', en: 'Cross-sections from Fourier circles', zh: '用傅立葉圓畫截面', dur: 10,
  lines: [['Each part carries its cross-section outline as a polar Fourier series with 7 rows. Drawn as rotating circles, it needs at most 13.', '每個部位帶一組截面輪廓，是 7 列的極座標傅立葉級數。用旋轉的圓畫出來，最多只要 13 個圓。'],
          [`The outline is one gene, inherited whole. This child's body outline came from ${C.parts[0].detail_src}: ${bodyWH.toFixed(2)} times as wide as tall.`, `輪廓是一個基因，整包遺傳。這個子代的身體輪廓來自 ${C.parts[0].detail_src}：寬是高的 ${bodyWH.toFixed(2)} 倍。`]],
  extra: () => `<div class="sec"><h3>Part 部位</h3><div class="chips">${fparts.map((p, i) => `<button class="chip fpart" data-k="${i}" aria-pressed="${i === 0}">${esc(p.name)}</button>`).join('')}</div><p class="drop" id="fsrc"></p></div>`},
 {id: 'skin', en: 'Skin grows over the bones', zh: '皮膚長在骨頭上', dur: 8,
  lines: [['The skin is one implicit surface around every bone at once, so it is always a single closed mesh.', '皮膚是同時包住所有骨頭的一個隱式曲面，所以永遠是一個封閉網格。'],
          ['Here each bone\'s thickness grows from 20% to 100%. Colour = share of the part\'s genes from A or B.', '這裡每根骨頭的粗細從 20% 長到 100%。顏色＝該部位的基因來自 A 或 B 的比例。']]},
 {id: 'detail', en: 'Round skin, then Fourier detail', zh: '圓的皮，再加上傅立葉細節', dur: 7,
  lines: [['Without the outline gene every cross-section is a circle. With it, the skin is pushed out or pulled in around each bone.', '沒有輪廓基因時，每個截面都是圓的；有了它，皮膚會在每根骨頭周圍往外推或往內縮。'],
          [`Here the body goes from round (1.00) to ${bodyWH.toFixed(2)} times as wide as tall.`, `這裡身體從圓的（1.00）變成寬是高的 ${bodyWH.toFixed(2)} 倍。`]]},
 {id: 'checks', en: 'Checks', zh: '檢查', dur: 6,
  lines: [['Every child is checked before it is handed on.', '每個子代交出去之前都要檢查。']],
  extra: () => `<div class="sec"><div class="tbl"><table>
    <tr><td>Closed mesh 封閉網格</td><td class="n ${b.closed ? 'ok' : 'bad'}">${b.closed ? 'yes 是' : 'no 否'}</td></tr>
    <tr><td>Outer shells 外殼數</td><td class="n">${b.outer_shells}</td></tr>
    <tr><td>Sealed bubbles 內部氣泡</td><td class="n">${b.bubbles}</td></tr>
    <tr><td>Limbs swallowed by another limb 被吞掉的肢體</td><td class="n">${b.swallowed_limbs.length}</td></tr>
    <tr><td>Triangles 三角形</td><td class="n">${b.triangles.toLocaleString()}</td></tr>
    <tr><td>Genes from A 來自 A 的基因</td><td class="n">${pct(C.ancestry_overall)}</td></tr>
    <tr><td>Result 結果</td><td class="n ${b.ok ? 'ok' : 'bad'}">${b.ok ? 'PASS 通過' : 'FAIL'}</td></tr></table></div></div>`},
